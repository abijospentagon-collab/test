<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sorted - AI-Powered Preschool Management SaaS</title>
    <meta name="description" content="Sorted is a voice-activated preschool operating system that centralizes daily operations, including attendance, tasks, inventory, and communication." />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
      /* CSS Reset and Global Variables */
      :root {
        --font-display: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

        /* HSL Colors */
        --bg-app: hsl(224, 71%, 4%);
        --bg-sidebar: hsl(222, 47%, 7%);
        --bg-glass: rgba(15, 23, 42, 0.65);
        --bg-glass-hover: rgba(30, 41, 59, 0.8);
        --border-glass: rgba(255, 255, 255, 0.07);
        --border-glass-focus: rgba(124, 58, 237, 0.4);
        
        --primary: hsl(263, 85%, 63%);
        --primary-glow: rgba(139, 92, 246, 0.35);
        --primary-hover: hsl(263, 85%, 55%);
        --accent: hsl(160, 84%, 45%);
        --accent-glow: rgba(16, 185, 129, 0.2);
        --accent-hover: hsl(160, 84%, 39%);
        --warning: hsl(35, 92%, 55%);
        --danger: hsl(342, 85%, 55%);
        --danger-glow: rgba(244, 63, 94, 0.2);

        --text-primary: hsl(210, 40%, 98%);
        --text-secondary: hsl(215, 20%, 65%);
        --text-muted: hsl(215, 16%, 47%);

        --radius-sm: 8px;
        --radius-md: 14px;
        --radius-lg: 20px;
        --radius-full: 9999px;

        --shadow-sm: 0 2px 8px -2px rgba(0, 0, 0, 0.5);
        --shadow-md: 0 8px 30px -4px rgba(0, 0, 0, 0.6);
        --shadow-lg: 0 16px 40px -10px rgba(0, 0, 0, 0.8);
        --shadow-glow: 0 0 20px 2px var(--primary-glow);
        
        --transition-fast: 0.15s ease;
        --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        --transition-slow: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        scrollbar-width: thin;
        scrollbar-color: var(--border-glass) transparent;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--border-glass);
        border-radius: var(--radius-full);
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--text-muted);
      }

      body {
        font-family: var(--font-sans);
        background-color: var(--bg-app);
        color: var(--text-primary);
        min-height: 100vh;
        overflow-x: hidden;
        line-height: 1.5;
        background-image: 
          radial-gradient(at 0% 0%, rgba(139, 92, 246, 0.1) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.08) 0px, transparent 50%),
          radial-gradient(at 50% 50%, rgba(30, 41, 59, 0.3) 0px, transparent 80%);
      }

      /* Layout Framework */
      .app-container {
        display: flex;
        width: 100%;
        position: relative;
        min-height: 100vh;
      }

      .main-content {
        flex: 1;
        padding: 2.5rem;
        margin-left: 280px; /* Width of Sidebar */
        min-height: 100vh;
        transition: margin-left var(--transition-normal);
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      @media (max-width: 1024px) {
        .main-content {
          margin-left: 80px;
          padding: 1.5rem;
        }
      }

      @media (max-width: 640px) {
        .main-content {
          margin-left: 0;
          padding: 1rem;
          padding-bottom: 5rem;
        }
      }

      /* Glassmorphism panel */
      .glass-panel {
        background: var(--bg-glass);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border-glass);
        border-radius: var(--radius-md);
        box-shadow: var(--shadow-md);
        transition: transform var(--transition-normal), border-color var(--transition-normal), box-shadow var(--transition-normal);
      }

      .glass-panel-interactive:hover {
        border-color: rgba(255, 255, 255, 0.15);
        box-shadow: var(--shadow-lg);
        transform: translateY(-2px);
      }

      /* Sidebar Styling */
      .sidebar {
        width: 280px;
        height: 100vh;
        position: fixed;
        left: 0;
        top: 0;
        background-color: var(--bg-sidebar);
        border-right: 1px solid var(--border-glass);
        padding: 2rem 1.5rem;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        z-index: 100;
        transition: width var(--transition-normal);
      }

      .sidebar-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 2rem;
      }

      .sidebar-logo-icon {
        width: 42px;
        height: 42px;
        border-radius: var(--radius-md);
        background: linear-gradient(135deg, var(--primary), var(--accent));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-weight: 800;
        font-size: 1.5rem;
        font-family: var(--font-display);
        box-shadow: var(--shadow-glow);
      }

      .sidebar-logo-text {
        font-family: var(--font-display);
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(to right, var(--text-primary), var(--text-secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -0.5px;
      }

      .sidebar-nav {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        overflow-y: auto;
        flex: 1;
        padding-right: 0.25rem;
      }

      .sidebar-link {
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 0.85rem 1rem;
        color: var(--text-secondary);
        text-decoration: none;
        font-weight: 500;
        border-radius: var(--radius-sm);
        transition: all var(--transition-fast);
        cursor: pointer;
        border: 1px solid transparent;
      }

      .sidebar-link:hover {
        color: var(--text-primary);
        background-color: rgba(255, 255, 255, 0.04);
      }

      .sidebar-link.active {
        color: white;
        background: linear-gradient(to right, rgba(139, 92, 246, 0.15), rgba(16, 185, 129, 0.03));
        border-color: rgba(139, 92, 246, 0.2);
        box-shadow: inset 3px 0 0 var(--primary);
      }

      .sidebar-link-icon {
        width: 20px;
        height: 20px;
      }

      .sidebar-footer {
        padding-top: 1.5rem;
        border-top: 1px solid var(--border-glass);
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .sidebar-avatar {
        width: 40px;
        height: 40px;
        border-radius: var(--radius-full);
        background: linear-gradient(135deg, var(--primary-hover), var(--primary-glow));
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 600;
        color: white;
      }

      .sidebar-user-info {
        display: flex;
        flex-direction: column;
      }

      .sidebar-user-name {
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .sidebar-user-role {
        font-size: 0.75rem;
        color: var(--text-muted);
      }

      @media (max-width: 1024px) {
        .sidebar {
          width: 80px;
          padding: 2rem 0.75rem;
          align-items: center;
        }
        .sidebar-logo-text, .sidebar-user-info, .sidebar-link span {
          display: none;
        }
        .sidebar-link {
          justify-content: center;
          padding: 0.85rem;
        }
        .sidebar-header, .sidebar-footer {
          justify-content: center;
        }
      }

      @media (max-width: 640px) {
        .sidebar {
          width: 100%;
          height: 60px;
          position: fixed;
          bottom: 0;
          top: auto;
          left: 0;
          flex-direction: row;
          padding: 0.5rem 1rem;
          border-right: none;
          border-top: 1px solid var(--border-glass);
          background-color: var(--bg-sidebar);
          justify-content: space-around;
          box-shadow: 0 -8px 24px rgba(0, 0, 0, 0.4);
        }
        .sidebar-header, .sidebar-footer {
          display: none;
        }
        .sidebar-nav {
          flex-direction: row;
          width: 100%;
          justify-content: space-between;
          overflow-x: auto;
          scrollbar-width: none;
        }
        .sidebar-nav::-webkit-scrollbar {
          display: none;
        }
        .sidebar-link {
          flex-direction: column;
          padding: 0.25rem 0.5rem;
          gap: 0.15rem;
          font-size: 0.65rem;
          flex: 1;
          min-width: 50px;
        }
        .sidebar-link.active {
          box-shadow: none;
          border-color: transparent;
          color: var(--primary);
        }
      }

      /* Page Header */
      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
        gap: 1rem;
      }

      .page-title-area {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
      }

      .page-title {
        font-family: var(--font-display);
        font-size: 2.2rem;
        font-weight: 700;
        letter-spacing: -0.5px;
      }

      .page-subtitle {
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      /* Dashboard Summary Widgets */
      .dashboard-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        width: 100%;
      }

      @media (max-width: 1200px) {
        .dashboard-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 640px) {
        .dashboard-grid {
          grid-template-columns: 1fr;
          gap: 1rem;
        }
      }

      .stat-card {
        padding: 1.5rem;
        display: flex;
        align-items: center;
        gap: 1.25rem;
        position: relative;
        overflow: hidden;
      }

      .stat-card::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        width: 100px;
        height: 100px;
        background: radial-gradient(circle, var(--stat-glow-color, rgba(139, 92, 246, 0.05)) 0%, transparent 70%);
        z-index: 0;
        pointer-events: none;
      }

      .stat-icon {
        width: 52px;
        height: 52px;
        border-radius: var(--radius-md);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        z-index: 1;
      }

      .stat-info {
        display: flex;
        flex-direction: column;
        z-index: 1;
      }

      .stat-label {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-secondary);
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .stat-value {
        font-family: var(--font-display);
        font-size: 1.75rem;
        font-weight: 700;
        margin-top: 0.15rem;
        color: var(--text-primary);
      }

      .stat-subtext {
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
      }

      /* Secondary Dashboard Row */
      .dashboard-main-row {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 1.5rem;
        width: 100%;
      }

      @media (max-width: 1024px) {
        .dashboard-main-row {
          grid-template-columns: 1fr;
        }
      }

      .dashboard-panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1.25rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--border-glass);
      }

      .dashboard-panel-title {
        font-family: var(--font-display);
        font-size: 1.2rem;
        font-weight: 600;
      }

      .dashboard-list {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .dashboard-list-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.85rem 1rem;
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border-glass);
      }

      .dashboard-list-item:hover {
        background: rgba(255, 255, 255, 0.04);
      }

      /* Button Styles */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.65rem 1.25rem;
        font-family: var(--font-sans);
        font-weight: 600;
        font-size: 0.9rem;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        cursor: pointer;
        transition: all var(--transition-fast);
        color: white;
        text-decoration: none;
      }

      .btn-primary {
        background: linear-gradient(135deg, var(--primary), var(--primary-hover));
        box-shadow: 0 4px 14px var(--primary-glow);
      }

      .btn-primary:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px var(--primary-glow);
        background: var(--primary-hover);
      }

      .btn-secondary {
        background: var(--bg-glass);
        border-color: var(--border-glass);
        color: var(--text-primary);
      }

      .btn-secondary:hover {
        background: var(--bg-glass-hover);
        border-color: rgba(255, 255, 255, 0.15);
      }

      .btn-danger {
        background: linear-gradient(135deg, var(--danger), #e11d48);
        box-shadow: 0 4px 14px var(--danger-glow);
      }

      .btn-danger:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 20px var(--danger-glow);
      }

      .btn-sm {
        padding: 0.4rem 0.85rem;
        font-size: 0.8rem;
        border-radius: var(--radius-sm);
      }

      /* Data Tables */
      .table-container {
        overflow-x: auto;
        width: 100%;
      }

      .data-table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      .data-table th {
        padding: 1rem 1.25rem;
        font-size: 0.8rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        color: var(--text-secondary);
        border-bottom: 1px solid var(--border-glass);
        background: rgba(255, 255, 255, 0.01);
      }

      .data-table td {
        padding: 1rem 1.25rem;
        font-size: 0.9rem;
        border-bottom: 1px solid var(--border-glass);
        color: var(--text-primary);
        vertical-align: middle;
      }

      .data-table tr:last-child td {
        border-bottom: none;
      }

      .data-table tr:hover td {
        background: rgba(255, 255, 255, 0.015);
      }

      /* Status Badges */
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 0.25rem 0.65rem;
        border-radius: var(--radius-full);
        font-size: 0.75rem;
        font-weight: 600;
      }

      .badge-active {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      .badge-inactive {
        background: rgba(244, 63, 94, 0.15);
        color: #fb7185;
        border: 1px solid rgba(244, 63, 94, 0.3);
      }

      .badge-warning {
        background: rgba(217, 119, 6, 0.15);
        color: #fbbf24;
        border: 1px solid rgba(217, 119, 6, 0.3);
      }

      .badge-primary {
        background: rgba(139, 92, 246, 0.15);
        color: #a78bfa;
        border: 1px solid rgba(139, 92, 246, 0.3);
      }

      /* Forms & Inputs */
      .form-group {
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        width: 100%;
      }

      .form-label {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-secondary);
      }

      .form-control {
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid var(--border-glass);
        border-radius: var(--radius-sm);
        padding: 0.65rem 1rem;
        color: white;
        font-family: var(--font-sans);
        font-size: 0.9rem;
        outline: none;
        transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
      }

      .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 2px var(--primary-glow);
      }

      .form-control::placeholder {
        color: var(--text-muted);
      }

      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
      }

      @media (max-width: 640px) {
        .form-row {
          grid-template-columns: 1fr;
        }
      }

      /* Modals */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: rgba(4, 6, 12, 0.75);
        backdrop-filter: blur(8px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        padding: 1rem;
      }

      .modal-content {
        width: 100%;
        max-width: 540px;
        padding: 2rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
        animation: modalEnter var(--transition-normal);
      }

      @keyframes modalEnter {
        from {
          opacity: 0;
          transform: scale(0.95) translateY(10px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-title {
        font-family: var(--font-display);
        font-size: 1.4rem;
        font-weight: 700;
      }

      .modal-close-btn {
        background: transparent;
        border: none;
        color: var(--text-secondary);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.25rem;
        border-radius: var(--radius-sm);
      }

      .modal-close-btn:hover {
        color: white;
        background: rgba(255, 255, 255, 0.05);
      }

      .modal-footer {
        display: flex;
        justify-content: flex-end;
        gap: 0.75rem;
        margin-top: 0.5rem;
      }

      /* Kanban Board */
      .kanban-board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1.5rem;
        width: 100%;
      }

      @media (max-width: 1024px) {
        .kanban-board {
          grid-template-columns: 1fr;
        }
      }

      .kanban-column {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 1.25rem;
        min-height: 500px;
      }

      .kanban-column-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 0.5rem;
      }

      .kanban-column-title {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-family: var(--font-display);
        font-weight: 600;
        font-size: 1.1rem;
      }

      .kanban-column-count {
        font-size: 0.75rem;
        background: rgba(255, 255, 255, 0.05);
        border-radius: var(--radius-full);
        padding: 0.15rem 0.5rem;
        font-weight: 500;
        color: var(--text-secondary);
        border: 1px solid var(--border-glass);
      }

      .kanban-cards {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
        flex: 1;
      }

      .kanban-card {
        padding: 1.1rem;
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        cursor: grab;
        border-left: 3px solid transparent;
      }

      .kanban-card.priority-High {
        border-left-color: var(--danger);
      }

      .kanban-card.priority-Medium {
        border-left-color: var(--warning);
      }

      .kanban-card.priority-Low {
        border-left-color: var(--accent);
      }

      .kanban-card-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-primary);
      }

      .kanban-card-desc {
        font-size: 0.8rem;
        color: var(--text-secondary);
        line-height: 1.4;
      }

      .kanban-card-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 0.75rem;
        color: var(--text-muted);
        margin-top: 0.25rem;
        border-top: 1px solid var(--border-glass);
        padding-top: 0.65rem;
      }

      .kanban-card-assignee {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        color: var(--text-secondary);
        font-weight: 500;
      }

      /* Voice Assistant floating btn and card */
      .voice-controller-btn {
        position: fixed;
        bottom: 2rem;
        right: 2rem;
        width: 64px;
        height: 64px;
        border-radius: var(--radius-full);
        background: linear-gradient(135deg, var(--primary), var(--primary-hover));
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        cursor: pointer;
        border: none;
        box-shadow: 0 8px 30px var(--primary-glow);
        z-index: 999;
        transition: transform var(--transition-normal), box-shadow var(--transition-normal);
        outline: none;
      }

      .voice-controller-btn:hover {
        transform: scale(1.08);
        box-shadow: 0 12px 35px var(--primary-glow);
      }

      .voice-controller-btn.recording {
        background: linear-gradient(135deg, var(--danger), #be123c);
        box-shadow: 0 8px 30px var(--danger-glow);
        animation: pulseRecording 1.5s infinite;
      }

      @keyframes pulseRecording {
        0% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(244, 63, 94, 0.7);
        }
        70% {
          transform: scale(1.08);
          box-shadow: 0 0 0 15px rgba(244, 63, 94, 0);
        }
        100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(244, 63, 94, 0);
        }
      }

      .voice-overlay {
        position: fixed;
        bottom: 8rem;
        right: 2rem;
        width: 380px;
        padding: 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
        z-index: 999;
        animation: slideInUp var(--transition-normal);
      }

      @keyframes slideInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .voice-overlay-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .voice-status-indicator {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .voice-pulse-dot {
        width: 8px;
        height: 8px;
        border-radius: var(--radius-full);
        background: var(--danger);
        animation: opacityPulse 1s infinite alternate;
      }

      @keyframes opacityPulse {
        from { opacity: 0.3; }
        to { opacity: 1; }
      }

      .voice-transcript-box {
        background: rgba(0, 0, 0, 0.3);
        border-radius: var(--radius-sm);
        padding: 1rem;
        font-size: 0.9rem;
        line-height: 1.4;
        min-height: 60px;
        color: var(--text-primary);
        border: 1px solid var(--border-glass);
      }

      .voice-transcript-placeholder {
        color: var(--text-muted);
        font-style: italic;
      }

      .voice-action-preview {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        border: 1px dashed rgba(16, 185, 129, 0.4);
        background: rgba(16, 185, 129, 0.05);
        border-radius: var(--radius-sm);
        padding: 0.85rem;
      }

      .voice-action-label {
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--accent);
        font-weight: 700;
        letter-spacing: 0.5px;
      }

      .voice-action-desc {
        font-size: 0.85rem;
        color: var(--text-primary);
        font-weight: 500;
      }

      .voice-action-buttons {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
        margin-top: 0.5rem;
      }

      /* Cleaning & translation support views */
      .cleaning-card-controls {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.5rem;
        border-top: 1px solid var(--border-glass);
        padding-top: 0.75rem;
      }

      .lang-select {
        background: var(--bg-sidebar);
        border: 1px solid var(--border-glass);
        color: var(--text-primary);
        padding: 0.25rem 0.5rem;
        border-radius: var(--radius-sm);
        font-size: 0.75rem;
        outline: none;
      }

      /* Messages View Layout */
      .messages-layout {
        display: grid;
        grid-template-columns: 1fr 2fr;
        gap: 1.5rem;
        min-height: 550px;
      }

      @media (max-width: 768px) {
        .messages-layout {
          grid-template-columns: 1fr;
        }
      }

      .chats-list {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        max-height: 550px;
        overflow-y: auto;
      }

      .chat-thread-card {
        padding: 1rem;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
        border-radius: var(--radius-sm);
        border: 1px solid transparent;
        transition: all var(--transition-fast);
      }

      .chat-thread-card:hover {
        background: rgba(255, 255, 255, 0.02);
      }

      .chat-thread-card.active {
        background: rgba(139, 92, 246, 0.08);
        border-color: rgba(139, 92, 246, 0.2);
      }

      .chat-thread-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .chat-thread-name {
        font-size: 0.9rem;
        font-weight: 600;
      }

      .chat-thread-time {
        font-size: 0.7rem;
        color: var(--text-muted);
      }

      .chat-thread-snippet {
        font-size: 0.78rem;
        color: var(--text-secondary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .chat-window {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 550px;
      }

      .chat-window-header {
        padding: 1rem 1.5rem;
        border-bottom: 1px solid var(--border-glass);
      }

      .chat-messages-container {
        flex: 1;
        padding: 1.5rem;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .message-bubble {
        max-width: 70%;
        padding: 0.85rem 1.1rem;
        border-radius: var(--radius-md);
        font-size: 0.9rem;
        line-height: 1.4;
        position: relative;
      }

      .message-bubble.sender-admin {
        background: linear-gradient(135deg, var(--primary), var(--primary-hover));

        align-self: flex-end;
        border-bottom-right-radius: 2px;
      }

      .message-bubble.sender-parent {

        color: var(--text-primary);

      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

        animation: fadeIn var(--transition-normal);

      function updateState(updater) {
        if (typeof updater === 'function') {

        }
        renderApp()
        
        // Sync state to localStorage
        try {
          localStorage.setItem('sorted_os_vanilla_state', JSON.stringify(state));
        } catch(e) {}

        fetch('api/state.php', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)

        const studentsCheckinPct = activeStudents > 0 ? Math.round((studentsCheckin / activeStudents) * 100) : 0

        const staffCheckin = state.attendance.staff.filter(s => s.date === state.attendanceDate && s.status === 'Present').length

        const lowStockCount = state.inventory.filter(item => item.stockLevel <= item.minStockLevel).length
        const pendingTasks = state.tasks.filter(t => t.status !== 'Done')

        // Children checked-in list
        const childrenListHtml = state.attendance.students.filter(s => s.date === state.attendanceDate).map(record => {
          const child = state.students.find(s => s.id === record.studentId)
          if (!child) return ''
          
          let badgeClass = 'badge-active'

      // ==========================================

      // ==========================================
      // 3. STAFF VIEW RENDER

          let roleBadge = 'badge-primary'
          if (member.role === 'Admin') roleBadge = 'badge-active'
          if (member.role === 'Support Staff') roleBadge = 'badge-warning'

          return `
            <tr>
              <td style="font-family: monospace; font-weight: 600">${member.id}</td>
              <td style="font-weight: 600">${member.name}</td>
              <td>
                <span class="badge ${roleBadge}">
                  {${member.role}}
                </span>
              </td>
              <td style="font-weight: 500">${member.assignedArea || 'Not Assigned'}</td>
              <td>${member.contact}</td>
              <td>${member.email}</td>
              <td>
                <button 
                  onclick="handleToggleStaffStatus('${member.id}')"
                  class="badge ${member.status === 'Active' ? 'badge-active' : 'badge-inactive'}"
                  style="border: 1px solid transparent; cursor: pointer; outline: none"
                  title="Toggle active status"

                  ${member.status}

              </td>
              <td>
                <div style="display: flex; gap: 0.5rem; justify-content: center">
                  <button onclick="handleEditStaff('${member.id}')" class="btn btn-secondary btn-sm" style="padding: 0.35rem">
                    <i data-lucide="edit-2" style="width: 13px; height: 13px"></i>
                  </button>
                  <button onclick="handleDeleteStaff('${member.id}')" class="btn btn-secondary btn-sm" style="padding: 0.35rem; color: var(--danger)">
                    <i data-lucide="trash-2" style="width: 13px; height: 13px"></i>
                  </button>
                </div>
              </td>
            </tr>

        return `
          <div class="fade-in" style="display: flex; flex-direction: column; gap: 1.5rem">
            <div class="page-header">
              <div class="page-title-area">
                <h1 class="page-title">Staff Roster</h1>

                <option value="Support Staff" ${state.staffRoleFilter === 'Support Staff' ? 'selected' : ''}>Support Staff</option>

              <div class="table-container">
                <table class="data-table">

                    <tr>

                      <th>Role</th>

      // ==========================================

      // ==========================================

            <div class="page-header">

                <p class="page-subtitle">Track children daily check-ins and support staff timesheets.</p>

              <div style="display: flex; gap: 0.5rem; align-items: center">
                <span style="font-size: 0.85rem; color: var(--text-secondary)">Roster Date:</span>
                <input 
                  type="date" 
                  value="${state.attendanceDate}"

                  <select 
                    onchange="updateState({ attendanceClassFilter: this.value })" 
                    class="form-control"
                    style="min-width: 130px; padding: 0.45rem"
                  >
                    <option value="All" ${state.attendanceClassFilter === 'All' ? 'selected' : ''}>All Classes</option>
                    <option value="Play Group" ${state.attendanceClassFilter === 'Play Group' ? 'selected' : ''}>Play Group</option>
                    <option value="Nursery" ${state.attendanceClassFilter === 'Nursery' ? 'selected' : ''}>Nursery</option>
                    <option value="LKG" ${state.attendanceClassFilter === 'LKG' ? 'selected' : ''}>LKG</option>
                    <option value="UKG" ${state.attendanceClassFilter === 'UKG' ? 'selected' : ''}>UKG</option>
                  </select>
                </div>
                
                <div style="display: flex; gap: 0.5rem">
                  <button onclick="handleBulkMarkStudents('Present')" class="btn btn-secondary btn-sm" style="border-color: rgba(16, 185, 129, 0.3)">Mark All Present</button>
                  <button onclick="handleBulkMarkStudents('Absent')" class="btn btn-secondary btn-sm" style="color: var(--danger); border-color: rgba(244, 63, 94, 0.3)">Mark All Absent</button>

              ` : `
                <span style="font-size: 0.85rem; color: var(--text-secondary)">Active Staff Members</span>
                <div style="display: flex; gap: 0.5rem">
                  <button onclick="handleBulkMarkStaff('Present')" class="btn btn-secondary btn-sm" style="border-color: rgba(16, 185, 129, 0.3)">Mark All Present</button>

            <div class="glass-panel" style="padding: 1rem">
              ${listHtml}

      function renderChildrenAttendanceList() {
        const active = state.students.filter(s => s.status === 'Active')
        const filtered = active.filter(s => state.attendanceClassFilter === 'All' ? true : s.class === state.attendanceClassFilter)

        const rows = filtered.map(student => {
          const record = state.attendance.students.find(r => r.date === state.attendanceDate && r.studentId === student.id)
          const status = record ? record.status : 'Absent'
          const remarks = record ? record.remarks : ''

          const statusOptions = ['Present', 'Absent', 'Half Day', 'Early Departure'].map(st => {
            const isSel = status === st
            let btnClass = isSel ? (st === 'Present' ? 'btn-primary' : st === 'Absent' ? 'btn-danger' : st === 'Half Day' ? 'btn-warning' : 'btn-primary') : 'btn-secondary'
            
            // Override early departure styling for UMD
            let styles = `padding: 0.25rem 0.5rem; font-size: 0.75rem; opacity: ${isSel ? '1' : '0.45'}`
            if (isSel && st === 'Early Departure') {
              styles += '; background: hsl(263, 85%, 63%)'
            }

            return `
              <button 
                onclick="handleMarkStudent('${student.id}', '${st}')" 
                class="btn ${btnClass} btn-sm"
                style="${styles}"
              >
                ${st}
              </button>
            `
          }).join('')

          return `
            <tr>
              <td style="font-family: monospace; font-weight: 600">${student.id}</td>
              <td style="font-weight: 600">${student.name}</td>
              <td><span class="badge badge-warning">${student.class} - Sec ${student.section}</span></td>
              <td>
                <div style="display: flex; gap: 0.35rem">${statusOptions}</div>
              </td>
              <td>
                <input 
                  type="text" 
                  value="${remarks}" 
                  placeholder="e.g. Cough, Picked up by dad" 
                  onchange="handleSaveStudentRemark('${student.id}', this.value)"
                  class="form-control"
                  style="padding: 0.35rem; font-size: 0.8rem; width: 100%"
                />
              </td>
            </tr>
          `
        }).join('')

        return `
          <div class="table-container">
            <table class="data-table">
              <thead>
                <tr>
                  <th>Student ID</th>
                  <th>Name</th>
                  <th>Class</th>
                  <th>Status Select</th>
                  <th>Remarks / Notes</th>
                </tr>
              </thead>
              <tbody>
                ${rows || '<tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--text-muted)">No active students.</td></tr>'}
              </tbody>
            </table>
          </div>
        `
      }

      function renderStaffAttendanceList() {
        const active = state.staff.filter(st => st.status === 'Active')
        
        const rows = active.map(member => {
          const record = state.attendance.staff.find(r => r.date === state.attendanceDate && r.staffId === member.id)
          const status = record ? record.status : 'Absent'
          const checkIn = record ? record.checkIn : '08:00 AM'
          const checkOut = record ? record.checkOut : ''

          const statusOptions = ['Present', 'Absent'].map(st => {
            const isSel = status === st
            const btnClass = isSel ? (st === 'Present' ? 'btn-primary' : 'btn-danger') : 'btn-secondary'
            return `
              <button 
                onclick="handleMarkStaff('${member.id}', '${st}')" 
                class="btn ${btnClass} btn-sm"
                style="padding: 0.25rem 0.5rem; font-size: 0.75rem; opacity: ${isSel ? '1' : '0.45'}"
              >
                ${st}
              </button>
            `
          }).join('')

          return `
            <tr>
              <td style="font-family: monospace; font-weight: 600">${member.id}</td>
              <td style="font-weight: 600">${member.name}</td>
              <td><span class="badge badge-primary">${member.role}</span></td>
              <td>
                <div style="display: flex; gap: 0.35rem">${statusOptions}</div>
              </td>
              <td>
                ${status === 'Present' ? `
                  <input 
                    type="text" 
                    value="${checkIn}" 
                    onchange="handleSaveStaffTimes('${member.id}', this.value, '${checkOut}')"
                    class="form-control" 
                    style="padding: 0.35rem; font-size: 0.8rem; width: 100px; display: inline"
                  />
                ` : '<span style="color: var(--text-muted)">N/A</span>'}
              </td>

      // Attendance Event Handlers
      window.handleMarkStudent = function(studentId, status) {
        const list = [...state.attendance.students]
        const idx = list.findIndex(r => r.date === state.attendanceDate && r.studentId === studentId)
        if (idx > -1) {
          list[idx].status = status
        } else {
          list.push({ date: state.attendanceDate, studentId, status, remarks: '' })
        }
        updateState({ attendance: { ...state.attendance, students: list } })
      }

      window.handleSaveStudentRemark = function(studentId, remark) {
        const list = [...state.attendance.students]
        const idx = list.findIndex(r => r.date === state.attendanceDate && r.studentId === studentId)
        if (idx > -1) {
          list[idx].remarks = remark
        } else {
          list.push({ date: state.attendanceDate, studentId, status: 'Present', remarks: remark })
        }
        updateState({ attendance: { ...state.attendance, students: list } })
      }

      window.handleMarkStaff = function(staffId, status) {
        const list = [...state.attendance.staff]
        const idx = list.findIndex(r => r.date === state.attendanceDate && r.staffId === staffId)
        if (idx > -1) {
          list[idx].status = status
        } else {
          list.push({ date: state.attendanceDate, staffId, status, checkIn: '08:00 AM', checkOut: '' })
        }
        updateState({ attendance: { ...state.attendance, staff: list } })
      }

      window.handleSaveStaffTimes = function(staffId, checkIn, checkOut) {
        const list = [...state.attendance.staff]
        const idx = list.findIndex(r => r.date === state.attendanceDate && r.staffId === staffId)
        if (idx > -1) {
          list[idx].checkIn = checkIn
          list[idx].checkOut = checkOut
        }
        updateState({ attendance: { ...state.attendance, staff: list } })
      }

      window.handleBulkMarkStudents = function(status) {
        const list = [...state.attendance.students]
        const active = state.students.filter(s => s.status === 'Active')
        const filtered = active.filter(s => state.attendanceClassFilter === 'All' ? true : s.class === state.attendanceClassFilter)
        
        filtered.forEach(student => {
          const idx = list.findIndex(r => r.date === state.attendanceDate && r.studentId === student.id)
          if (idx > -1) {
            list[idx].status = status
          } else {
            list.push({ date: state.attendanceDate, studentId: student.id, status, remarks: '' })
          }
        })
        updateState({ attendance: { ...state.attendance, students: list } })
      }

      window.handleBulkMarkStaff = function(status) {
        const list = [...state.attendance.staff]
        const active = state.staff.filter(st => st.status === 'Active')
        
        active.forEach(member => {
          const idx = list.findIndex(r => r.date === state.attendanceDate && r.staffId === member.id)
          if (idx > -1) {
            list[idx].status = status
          } else {
            list.push({ date: state.attendanceDate, staffId: member.id, status, checkIn: status === 'Present' ? '08:00 AM' : '', checkOut: '' })
          }
        })
        updateState({ attendance: { ...state.attendance, staff: list } })
      }

      window.handleAdjustStock = function(id, amt) {
        const list = state.inventory.map(item => {
          if (item.id !== id) return item
          return { ...item, stockLevel: Math.max(0, item.stockLevel + amt) }
        })
        updateState({ inventory: list })
      }

      window.handleSimulateConsumption = function() {
        if (confirm("Simulate material consumption for today's classroom activities? This consumes 10 sheets of 'Colored Chart Paper' and 4 'Paper Glue Sticks'.")) {
          const list = state.inventory.map(item => {
            if (item.name === 'Colored Chart Paper') return { ...item, stockLevel: Math.max(0, item.stockLevel - 10) }
            if (item.name === 'Paper Glue Sticks') return { ...item, stockLevel: Math.max(0, item.stockLevel - 4) }
            return item
          })
          updateState({ inventory: list })
          alert("Consumption simulated successfully!")
        }
      }

      window.handleSpeak = function(text) {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel()
          const utterance = new SpeechSynthesisUtterance(text)
          if (state.cleaningLanguage === 'Spanish') utterance.lang = 'es-ES'
          else if (state.cleaningLanguage === 'Hindi') utterance.lang = 'hi-IN'
          else utterance.lang = 'en-US'
          window.speechSynthesis.speak(utterance)
        } else {
          alert('TTS not supported in this browser.')
        }
      }

      window.handleToggleCleaningTask = function(id) {
        const list = state.tasks.map(t => {
          if (t.id !== id) return t
          const next = t.status === 'Pending' ? 'In Progress' : t.status === 'In Progress' ? 'Done' : 'Pending'
          return { ...t, status: next }
        })
        updateState({ tasks: list })
      }

        updateState({ activities: list })

      window.handleToggleEventStatus = function(id) {
        const list = state.events.map(ev => {
          if (ev.id !== id) return ev
          const next = ev.status === 'Upcoming' ? 'Ongoing' : ev.status === 'Ongoing' ? 'Completed' : 'Upcoming'
          return { ...ev, status: next }
        })
        updateState({ events: list })

        if (confirm("Delete this activity plan?")) {
          updateState({ activities: state.activities.filter(a => a.id !== id) })

        if (confirm("Delete this event?")) {

        const chatThreadsHtml = state.messages.conversations.map((convo, idx) => {
          const lastMsg = convo.messages[convo.messages.length - 1]
          const snippet = lastMsg ? lastMsg.text : 'No messages'
          return `
            <div 
              onclick="updateState({ activeChatIndex: ${idx} })"
              class="chat-thread-card ${state.activeChatIndex === idx ? 'active' : ''}"
            >
              <div class="chat-thread-header">
                <span class="chat-thread-name">${convo.parentName}</span>
                <span style="font-size: 0.7rem; color: var(--text-muted)">02:15 PM</span>
              </div>
              <span style="font-size: 0.72rem; color: var(--text-muted); font-weight: 600">Parent of: ${convo.studentName}</span>
              <p class="chat-thread-snippet">${snippet}</p>
            </div>
          `
        }).join('')

        const activeConvo = state.messages.conversations[state.activeChatIndex]
        let chatWindowHtml = ''
        
        if (activeConvo) {
          const bubblesHtml = activeConvo.messages.map(msg => `
            <div class="message-bubble sender-${msg.sender}">
              <span>${msg.text}</span>
            </div>
          `).join('')

          chatWindowHtml = `
            <div class="chat-window">
              <div class="chat-window-header">
                <h4 style="font-size: 0.95rem; font-weight: 700">${activeConvo.parentName}</h4>
                <p style="font-size: 0.75rem; color: var(--text-muted)">Parent channel • Student: ${activeConvo.studentName} (${activeConvo.studentId})</p>
              </div>
              
              <div class="chat-messages-container">
                ${bubblesHtml}
              </div>
              
              <form onsubmit="handleSendChat(event)" class="chat-input-bar">
                <input 
                  type="text" 
                  id="chat-reply-input"
                  placeholder="Type a reply to ${activeConvo.parentName}..."
                  class="form-control"
                  style="flex: 1; padding: 0.5rem 1rem"
                />
                <button type="submit" class="btn btn-primary" style="padding: 0.5rem">
                  <i data-lucide="send" style="width:16px; height:16px"></i>
                </button>
              </form>
            </div>
          `
        }

        return `
          <div class="fade-in" style="display: flex; flex-direction: column; gap: 1.5rem">
            
            <div class="page-header">
              <div class="page-title-area">
                <h1 class="page-title">Communication</h1>
                <p class="page-subtitle">Broadcast reminders, alerts, and conduct private parent conversations.</p>
              </div>
            </div>

            <div class="messages-layout">
              <!-- Templates & Broadcast -->
              <div style="display: flex; flex-direction: column; gap: 1.5rem">
                <div class="glass-panel" style="padding: 1.25rem">
                  <div class="dashboard-panel-header">
                    <h2 class="dashboard-panel-title">Message Templates</h2>
                  </div>
                  <div style="display: flex; flex-direction: column; gap: 0.5rem">
                    ${templatesHtml}
                  </div>
                </div>

                <div class="glass-panel" style="padding: 1.25rem">
                  <div class="dashboard-panel-header">
                    <h2 class="dashboard-panel-title">Broadcast Alert</h2>
                  </div>
                  <form onsubmit="handleSendBroadcast(event)" style="display: flex; flex-direction: column; gap: 0.85rem">
                    <div class="form-group">
                      <label class="form-label">Subject</label>
                      <input type="text" id="broadcast-subj" class="form-control" placeholder="Subject line..." required />
                    </div>
                    <div class="form-group">
                      <label class="form-label">Broadcast Text</label>
                      <textarea id="broadcast-body" class="form-control" rows="3" placeholder="Write message..." required style="resize: none"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%">Broadcast to All Parents</button>
                  </form>
                </div>
              </div>

              <!-- Chat window -->
              <div class="glass-panel" style="padding: 1rem; display: grid; grid-template-columns: 1.2fr 2fr; gap: 1rem">
                <div class="chats-list" style="border-right: 1px solid var(--border-glass); padding-right: 0.75rem">
                  ${chatThreadsHtml}
                </div>
                <div>
                  ${chatWindowHtml}
                </div>
              </div>
            </div>

          </div>
        `
      }

      window.handleApplyTemplate = function(type, subject, content) {
        document.getElementById('broadcast-subj').value = subject
        document.getElementById('broadcast-body').value = content
      }

      window.handleSendBroadcast = function(e) {
        e.preventDefault()
        const sub = document.getElementById('broadcast-subj').value
        const body = document.getElementById('broadcast-body').value
        alert(`Broadcast Notification Sent!\nSubject: ${sub}\nContent: ${body}`)
        document.getElementById('broadcast-subj').value = ''
        document.getElementById('broadcast-body').value = ''
      }

      window.handleSendChat = function(e) {
        e.preventDefault()
        const inp = document.getElementById('chat-reply-input')
        if (!inp.value.trim()) return

        const conversations = [...state.messages.conversations]
        conversations[state.activeChatIndex].messages.push({
          sender: 'admin',
          text: inp.value.trim(),
          timestamp: new Date().toISOString()
        })
        inp.value = ''
        updateState({ messages: { ...state.messages, conversations } })
      }

            let status = s.status
            if (s.class === 'Play Group') next = 'Nursery'
            else if (s.class === 'Nursery') next = 'LKG'
